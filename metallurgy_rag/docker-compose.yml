services:
  neo4j-restore:
    image: neo4j:5.26
    user: neo4j
    entrypoint: ["/bin/sh", "/restore-neo4j.sh"]
    volumes:
      - neo4j_data:/data
      - ./kg_rag/dump:/dump:ro
      - ./docker/restore-neo4j.sh:/restore-neo4j.sh:ro

  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    depends_on:
      neo4j-restore:
        condition: service_completed_successfully
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jpass}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2g}
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7476:7474"
      - "127.0.0.1:7690:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.13.4
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${QDRANT_STORAGE_PATH:-./data/qdrant}:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpass}
      NEO4J_DATABASE: neo4j
      RAG_QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION:-metallurgy_search_units}
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-ollama}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-qwen3:8b}
      RAG_OLLAMA_URL: ${RAG_OLLAMA_URL:-http://host.docker.internal:11434}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_LLM_TIMEOUT: ${RAG_LLM_TIMEOUT:-180}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      # Common project .env; used by the independent OpenRouter Judge.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # Judge may use an independent, stronger OpenAI-compatible model.
      RAG_JUDGE_PROVIDER: ${RAG_JUDGE_PROVIDER:-}
      RAG_JUDGE_MODEL: ${RAG_JUDGE_MODEL:-}
      RAG_JUDGE_BASE_URL: ${RAG_JUDGE_BASE_URL:-}
      RAG_JUDGE_API_KEY: ${RAG_JUDGE_API_KEY:-}
      RAG_JUDGE_TIMEOUT: ${RAG_JUDGE_TIMEOUT:-}
      RAG_JUDGE_THRESHOLD: ${RAG_JUDGE_THRESHOLD:-0.82}
      RAG_JUDGE_MAX_ITERATIONS: ${RAG_JUDGE_MAX_ITERATIONS:-3}
      # The present metallurgy_search_units collection has 768-dimensional
      # vectors and was built with multilingual-e5-base.
      RAG_DENSE_MODEL: ${RAG_DENSE_MODEL:-intfloat/multilingual-e5-base}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-}
      RAG_RERANKER_MAX_LENGTH: ${RAG_RERANKER_MAX_LENGTH:-1024}
      RAG_RERANKER_BATCH_SIZE: ${RAG_RERANKER_BATCH_SIZE:-4}
      RAG_RERANKER_DEVICE: ${RAG_RERANKER_DEVICE:-}
      RAG_RELEVANCE_THRESHOLD: ${RAG_RELEVANCE_THRESHOLD:-0.55}
    volumes:
      # Sparse vocabulary belongs beside the Qdrant collection. It is tiny but
      # required for stable sparse-query IDs after a container restart.
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ui:
    build: .
    command: ["ui"]
    environment:
      RAG_API_URL: http://api:8000
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-ollama}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-qwen3:8b}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_OLLAMA_URL: ${RAG_OLLAMA_URL:-http://host.docker.internal:11434}
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Explicit, one-shot indexing service. Use only after mounting a fresh
  # corpus_split or when intentionally rebuilding the collection.
  indexer:
    build: .
    command: ["index", "--recreate"]
    profiles: ["tools"]
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./corpus_split:/app/corpus_split:ro
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant

volumes:
  neo4j_data:
    name: metallurgy_rag_neo4jdata
  hf_cache:
